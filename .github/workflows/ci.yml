name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Import Isolation
  # All other jobs depend on this passing.  Installs core ONLY (no pydantic)
  # so that any accidental import of pydantic in core/ is a hard failure.
  # -------------------------------------------------------------------------
  isolation:
    name: Import Isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core only (no optional deps, no pydantic)
        run: pip install -e . pytest

      - name: Verify pydantic is NOT installed in this environment
        run: python -c "import pydantic" && echo "FAIL — pydantic should not be installed" && exit 1 || echo "OK — pydantic not present"

      - name: Run isolation test suite
        run: pytest tests/isolation/ -v --tb=short

  # -------------------------------------------------------------------------
  # Job 2: Linting  (does not depend on isolation; runs in parallel)
  # -------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff>=0.4"

      - name: Run ruff check
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format --check src/ tests/

  # -------------------------------------------------------------------------
  # Job 3: Type Checking  (depends on isolation)
  # -------------------------------------------------------------------------
  typecheck:
    name: Type Check (mypy --strict)
    runs-on: ubuntu-latest
    needs: [isolation]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ``mcp`` too: the SDK adapters (idempotency_sdk, inject) import it.
      - name: Install all deps (including pydantic and mcp for adapter type checking)
        run: pip install -e ".[pydantic,mcp,dev]"

      - name: Run mypy strict
        run: mypy src/

      # The mcp 1.x adapter is typed against mcp 1.x, which the step above
      # cannot have installed beside mcp 2.x.
      - name: mcp 1.x environment
        run: |
          python -m venv /tmp/mcp1
          /tmp/mcp1/bin/pip install "mcp==1.9.4" "mcp-server-sqlite==2025.4.25" "pydantic==2.11.7"

      - name: Run mypy strict on the mcp 1.x modules, against mcp 1.x
        run: >-
          mypy --config-file mypy-mcp1.ini --python-executable /tmp/mcp1/bin/python
          src/stateguard/adapters/mcp/idempotency_sdk1.py src/stateguard/adapters/mcp/inject.py

  # -------------------------------------------------------------------------
  # Job 4: Tests  (depends on isolation, matrix across OS x Python versions)
  #
  # Runs on both Linux and macOS to catch platform-specific regressions
  # (path handling, file I/O, encoding, etc.) automatically on every push.
  # Windows is intentionally not included yet — see M9_AUDIT.md and
  # M9_1_RELEASE_REPORT.md for the rationale (no known blockers, but not
  # yet verified, and out of scope for this stabilization pass).
  # -------------------------------------------------------------------------
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: [isolation]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.13 and 3.14 are here because the JSON depth bound exists: CPython
        # changed how deep text fails three times across these versions (see
        # TestPathologicalJsonIsBounded), and nothing but the matrix catches a
        # regression into relying on that again.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # ``mcp`` is here so tests/examples/test_mcp_demo.py runs: it is the
      # only test that drives the documented proxy over real MCP stdio, and
      # it skips itself without the SDK. ``stateguard.adapters.mcp`` itself
      # must not need it -- the isolation job checks that with core alone.
      - name: Install all deps
        run: pip install -e ".[pydantic,mcp,dev]"

      # The injector tests run the pinned third-party mcp 1.x server
      # (tests/examples/test_inject_python.py); without this they skip.
      - name: mcp 1.x environment for the injector tests
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          python -m venv /tmp/mcp1
          /tmp/mcp1/bin/pip install "mcp==1.9.4" "mcp-server-sqlite==2025.4.25" "pydantic==2.11.7"
          echo "STATEGUARD_MCP1_PYTHON=/tmp/mcp1/bin/python" >> "$GITHUB_ENV"

      - name: Run unit + integration tests with coverage
        run: |
          pytest tests/ \
            --ignore=tests/isolation/ \
            -v \
            --tb=short \
            --cov=stateguard \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Run isolation tests again (pydantic IS installed — tests the other scenario)
        run: pytest tests/isolation/ -v --tb=short

      - name: CLI smoke test
        run: |
          echo '{"fields": [{"path": "x", "type": "string"}]}' > /tmp/schema.json
          echo '{"x": "hello"}' > /tmp/payload.json
          stateguard check --schema /tmp/schema.json --payload /tmp/payload.json
          echo '{"name": "t", "inputSchema": {"type": "object", "properties": {"n": {"type": "integer"}}, "required": ["n"]}}' > /tmp/tool.json
          echo '{"n": "5"}' > /tmp/arguments.json
          stateguard check --tool /tmp/tool.json --payload /tmp/arguments.json
          echo '{"tools": [{"name": "t", "inputSchema": {"type": "object", "properties": {"n": {"type": "integer"}}, "required": ["n"]}}]}' > /tmp/tools.json
          echo '{"name": "t", "arguments": {"n": "5"}}' > /tmp/calls.jsonl
          stateguard replay --tools /tmp/tools.json --calls /tmp/calls.jsonl
          stateguard diff /tmp/tools.json /tmp/tools.json

      - name: Benchmark harness smoke test
        run: python benchmarks/runner.py --no-write

      - name: MCP adapter benchmark smoke test
        run: python benchmarks/mcp_bench.py --repeat 1

      - name: Runtime failure measurement (synthetic, quick)
        run: python benchmarks/runtime/measure.py --per-fault 1

      - name: Session recovery workload (synthetic, quick)
        run: python benchmarks/runtime/recovery.py --per-type 1

      - name: Record/replay measurement (fault-injection corpus, quick)
        run: python benchmarks/runtime/replay.py --no-determinism --overhead-runs 0

      - name: Mid-restart race regression (T14, fault injection)
        run: python benchmarks/runtime/race.py --runs 5

      - name: Auth-failure classification (T11, fault injection)
        run: python benchmarks/runtime/auth.py

      # Gates on regressions and on stale known_gap markers only -- a
      # documented gap failing is the corpus doing its job, not CI breaking.
      - name: Calibration corpus
        run: python benchmarks/calibrate.py --verbose
