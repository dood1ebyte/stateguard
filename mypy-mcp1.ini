# Type-check the mcp 1.x modules against a real mcp 1.x install:
#   mypy --config-file mypy-mcp1.ini --python-executable /path/to/mcp1/bin/python \
#     src/stateguard/adapters/mcp/idempotency_sdk1.py src/stateguard/adapters/mcp/inject.py
# Same strictness as pyproject.toml; only the mcp 2.x adapter is skipped here.
[mypy]
python_version = 3.11
strict = True
warn_return_any = True
warn_unused_configs = True
no_implicit_reexport = True

[mypy-stateguard.adapters.mcp.idempotency_sdk]
ignore_errors = True

# As in pyproject.toml: Pydantic generates dynamic attributes.
[mypy-stateguard.adapters.pydantic.*]
warn_return_any = False
